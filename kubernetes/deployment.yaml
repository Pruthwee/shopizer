apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopizer
  namespace: shopizer
  labels:
    app: shopizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopizer
  template:
    metadata:
      labels:
        app: shopizer
    spec:
      containers:
        - name: shopizer
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopizer-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopizer-secrets
                  key: db-password
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopizer-secrets
                  key: redis-password
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: uploads-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}
